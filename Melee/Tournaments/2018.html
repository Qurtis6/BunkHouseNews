<!DOCTYPE html>
<html>

<head>
  <title>2018 Tournament</title>
  <script type="text/javascript" src="melee.js"></script>
  <link href="tournaments.css" rel="stylesheet" type="text/css" />
  <link href="results.css" rel="stylesheet" type="text/css" />
</head>

<body data-json="data/2018.json">
  <video autoplay muted loop id="myVideo">
    <source src="../Images/Tournament Background.webm" type="video/webm">
    Your browser does not support HTML5 video.
  </video>
  <div class="center">
    <div class="header-bar">
      <a href="../index.html"><img src="../Images/Wehrman Melee Logo.png" class="logo"/></a>
      <h1>2018 Smash Tournament</h1>
    </div>

    <div class="tab">
      <button class="tablinks" id="b-Results" onclick="Section(event, 'Results')">Results</button>
      <button class="tablinks" id="b-Final Bracket" onclick="Section(event, 'Final Bracket')">Final Bracket</button>
    </div>

    <div id="Results" class="container">
      <div class="results">
        <div style="display: flex;">
          <div class="first box">
            1 Curtis
            <img src="../Images/Classic Poses/Left/marth.png" class="pose">
          </div>
          <div class="second box">
            2 Preston
            <img src="../Images/Classic Poses/Left/fox.png" class="pose">
          </div>
          <div class="third box">
            3 Andrew
            <img src="../Images/Classic Poses/Left/sheik-green.png" class="pose">
          </div>
        </div>
      </div>
    </div>

    <div id="Final Bracket" class="container">
      <div id="winners"></div>
      <br>&emsp;Loser's Bracket
      <br><br>
      <div id="losers"></div>
      <script src="bracket.js"></script> <!-- External JavaScript file -->
    </div>

    <br>
  </div>
  <script src="tournament.js"></script>
</body>


</html>
