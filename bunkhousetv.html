<body>
    <h2>Bunkhouse TV</h2>
    <div id="video-container">
        <div id="player"></div>
    </div>
    
    <script>
        let player;
        let videoQueue = [];
        let currentVideoIndex = 0;
        
        // Predefined playlists
        const playlistIds = [
            "PL-0ud66ADHGFdVDSUO_8bUX3GIJM3Eisw",
        ];
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                events: {
                    'onReady': loadPlaylists,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
        
        function loadPlaylists() {
            let fetchPromises = playlistIds.map(id => fetchPlaylistVideos(id));
            Promise.all(fetchPromises).then(() => {
                shuffleQueue();
                playNextVideo();
            });
        }
        
        function fetchPlaylistVideos() {
    return fetch('http://localhost:5000/api/videos')
        .then(response => response.json())
        .then(data => {
            videoQueue = data.videos;
        })
        .catch(error => console.error("Error fetching videos:", error));
}
        
        function shuffleQueue() {
            for (let i = videoQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [videoQueue[i], videoQueue[j]] = [videoQueue[j], videoQueue[i]];
            }
        }
        
        function playNextVideo() {
            if (videoQueue.length > 0) {
                if (currentVideoIndex >= videoQueue.length) {
                    currentVideoIndex = 0;
                    shuffleQueue();
                }
                player.loadVideoById(videoQueue[currentVideoIndex]);
                currentVideoIndex++;
            }
        }
        
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo();
            }
        }
    </script>
</body>
</html>
